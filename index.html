<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playlist Player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
:root{--bg:#fff;--panel:#f5f5f5;--ink:#000;--mut:#707070;--line:rgba(0,0,0,.16);--zebra:rgba(0,0,0,.035);--ac:#000;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--panel:#0c0c0c;--ink:#fff;--mut:#8a8a8a;--line:rgba(255,255,255,.18);--zebra:rgba(255,255,255,.04);--ac:#fff}}
:root[data-theme="dark"]{--bg:#000;--panel:#0c0c0c;--ink:#fff;--mut:#8a8a8a;--line:rgba(255,255,255,.18);--zebra:rgba(255,255,255,.04);--ac:#fff}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--ink) transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.app{height:100%;max-width:1400px;margin:auto;padding:16px;display:grid;grid-template-columns:minmax(340px,460px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:16px}
.deck{position:relative;overflow:hidden auto;border:1.5px solid var(--ink);border-radius:28px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-height:0}
.deck>*{position:relative;z-index:1}
.deck>.shapes{position:absolute;z-index:0}
.shapes{inset:0;pointer-events:none;color:var(--ink);opacity:.16}
.shapes svg{width:100%;height:100%}
.shapes .f,.shapes .s{transform-box:fill-box;transform-origin:center}
.shapes .f{animation:fl 9s ease-in-out infinite alternate}
.shapes .s{animation:spin 40s linear infinite}
@keyframes fl{to{transform:translate(14px,-18px) rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.screen{display:flex;flex-direction:column;gap:12px;text-align:center}
.stage{position:relative;width:min(100%,430px,44vh);aspect-ratio:1;margin:0 auto;flex:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.cover{position:absolute;inset:19%;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:repeating-radial-gradient(circle,transparent 0 5px,var(--line) 5px 6px) center/cover;filter:grayscale(1) contrast(1.1);scale:calc(1 + var(--b,0)*.05);animation:spin 24s linear infinite;animation-play-state:paused}
body[data-p="1"] .cover{animation-play-state:running}
.cover:hover{filter:none}
.cover .note{width:34%;height:34%;fill:currentColor}
.cover.has .note{display:none}
.cover.has::after{content:"";position:absolute;inset:44%;border-radius:50%;background:var(--bg);box-shadow:0 0 0 2px var(--ink)}
.t{font-size:34px;line-height:1.05;font-weight:800;font-stretch:62%;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmt{margin-top:2px;color:var(--mut);font-size:12px}
.time{display:flex;align-items:baseline;justify-content:center;gap:8px}
.time b{font-size:44px;line-height:1;font-weight:800;font-stretch:62%;min-width:3.2ch;text-align:right}
.time span{color:var(--mut);font-size:15px}
.time span::before{content:"/ "}
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:20px;padding:9px 0;margin:0;background:linear-gradient(90deg,var(--ink) var(--p,0%),var(--line) var(--p,0%));background-clip:content-box;cursor:pointer;border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--ink)}
input[type=range]::-moz-range-thumb{width:8px;height:8px;border-radius:50%;background:var(--ink);border:3px solid var(--bg);box-shadow:0 0 0 1.5px var(--ink)}
.keys{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.grp{display:flex;gap:8px;align-items:center;flex:1 0 100%;justify-content:center}
.key{position:relative;width:46px;height:46px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:50%;transition:transform .15s,background .15s,color .15s}
.key:hover,.key.on{background:var(--ink);color:var(--bg)}
.key:active{transform:scale(.92)}
.key svg{width:18px;height:18px;fill:currentColor}
.key svg.st{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.key.main{width:68px;height:68px;background:var(--ink);color:var(--bg)}
.key.main:hover{transform:scale(1.06)}
.key.main svg{width:26px;height:26px}
#rep[data-m="2"]::before{content:"1";position:absolute;bottom:3px;right:9px;font-size:9px;font-weight:800}
#pp[data-s="pause"] .i-play,#pp[data-s="play"] .i-pause{display:none}
.vol{flex:1;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);min-height:0;border:1.5px solid var(--ink);border-radius:28px;overflow:hidden;background:var(--panel)}
.list,.lyrics{display:flex;flex-direction:column;min-height:0}
.lyrics{order:-1}
.list{border-left:1.5px solid var(--line)}
.bar,.lbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1.5px solid var(--line)}
.lbar{color:var(--mut);font-size:12px}.lbar span{flex:1}
input[type=search]{flex:1;min-width:0;background:transparent;border:0;border-bottom:1.5px solid var(--line);padding:6px 0;color:var(--ink);font:inherit;border-radius:0}
input[type=search]:focus{border-bottom-color:var(--ink);outline:0}
.tb{padding:6px 14px;border:1.5px solid var(--ink);border-radius:999px;font-weight:700;font-size:12px}
.tb.fill,.tb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.head,.row{display:grid;grid-template-columns:36px minmax(0,1.6fr) minmax(0,1fr) 48px 22px;gap:10px;align-items:center;padding:0 16px}
.head{padding-top:7px;padding-bottom:7px;color:var(--mut);font-size:12px;border-bottom:1.5px solid var(--line)}
.rows{flex:1;overflow:auto}
.row{height:30px;cursor:default}
.row.z{background:var(--zebra)}
.row:hover{background:var(--line)}
.row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .x{opacity:0;color:var(--mut);text-align:center;font-size:16px;cursor:pointer}
.row:hover .x{opacity:1}
.row.cur{background:var(--ink);color:var(--bg)}
.row.cur .x{color:inherit}
.pl{display:inline-block;border-left:8px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent}
.row.cur .pl{border-left-color:var(--bg)}
.empty{margin:auto;padding:40px;max-width:320px;text-align:center;color:var(--mut)}
.drop{outline:2px dashed var(--ink);outline-offset:-6px}
.lyr{flex:1;min-height:0;overflow:auto;position:relative;padding:30px 22px 55%;scrollbar-width:none}
.ln{position:relative;margin:4px 0;padding:8px 14px;font-size:clamp(24px,3vw,38px);line-height:1.1;font-weight:800;font-stretch:66%;text-transform:uppercase;opacity:.22;filter:blur(.6px);transform:scale(.94);transform-origin:left center;transition:opacity .4s,filter .4s,transform .5s cubic-bezier(.34,1.56,.64,1)}
.ln[data-t]{cursor:pointer}
.ln[data-t]:hover{opacity:.5}
.ln .w{--r:-5deg}
.ln .w:nth-child(even){--r:5deg}
.ln.on{opacity:1;filter:none;transform:scale(1.03);background:var(--ink);color:var(--bg);animation:wipe .5s cubic-bezier(.7,0,.2,1)}
.ln.on .w{display:inline-block;animation:pop .55s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*55ms)}
@keyframes pop{from{opacity:0;transform:translateY(.7em) scale(.5) rotate(var(--r))}to{opacity:1;transform:none}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.ln.msg{font-size:14px;font-weight:400;font-stretch:100%;text-transform:none;opacity:1;filter:none;transform:none;padding-left:0}
.cfg{display:grid;gap:8px;margin:10px 16px 0;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;font-size:12px;color:var(--mut)}
.cfg[hidden]{display:none}
.cfg label{display:flex;align-items:center;gap:8px}
.cfg .r{display:grid;grid-template-columns:1fr auto}
.cfg .r input{grid-column:1/-1}
.cfg small{line-height:1.3}
.meta{flex:1;min-height:0;overflow:auto;padding:6px 16px 20px}
.meta[hidden]{display:none}
.kv{display:grid;grid-template-columns:minmax(90px,30%) minmax(0,1fr);gap:12px;padding:6px 0;border-bottom:1.5px solid var(--line);font-size:13px}
.kv dt{color:var(--mut);overflow-wrap:anywhere}.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.tabs{display:none}
@media (max-width:760px){
.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);padding:8px;gap:8px}
.deck{padding:14px;border-radius:22px;overflow:hidden}
.stage{width:min(100%,220px)}
.t{font-size:24px}.time b{font-size:30px}
.vol{display:none}
.tabs{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.tabs button{flex:1;padding:9px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{grid-template-columns:minmax(0,1fr);border-radius:22px}
.app[data-view="list"] .lyrics,.app[data-view="lyr"] .list{display:none}
.list{border-left:0}
.head,.row{grid-template-columns:28px minmax(0,1fr) 44px 22px}
.head span:nth-child(3),.row span:nth-child(3){display:none}
.ln{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app" data-view="list">
  <header class="deck">
    <div class="shapes" aria-hidden="true"><svg viewBox="0 0 460 760" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width="1.5"><defs><pattern id="dt" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="currentColor" stroke="none"/></pattern></defs><rect x="250" y="540" width="200" height="200" fill="url(#dt)" stroke="none"/><circle class="f" cx="420" cy="70" r="120"/><circle class="f" cx="420" cy="70" r="80"/><rect class="s" x="20" y="560" width="90" height="90"/><path class="f" d="M40 120l36 62H4z"/><path d="M60 40v28M46 54h28M400 640v28M386 654h28M200 720v28M186 734h28M0 380h120M0 392h90M0 404h60"/><circle cx="60" cy="460" r="26" fill="currentColor" stroke="none"/></svg></div>
    <div class="screen">
      <div class="stage"><canvas id="viz" aria-hidden="true"></canvas><div class="cover" id="cover" role="img" aria-label="Sampul album"><svg class="note" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V8h6V3z"/></svg></div></div>
      <div><div class="t" id="nt">Belum ada lagu</div><div class="a" id="na">Tambah file untuk mulai</div><div class="fmt" id="fmt"></div></div>
      <div class="time"><b id="cur">0:00</b><span id="dur">0:00</span></div>
    </div>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posisi lagu">
    <div class="keys">
      <div class="grp">
        <button class="key" id="shuf" title="Acak (S)" aria-label="Acak"><svg class="st" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3c5 0 6 10 11 10h3M3 17h3c1.7 0 3-1 4-2.7M14 9.2C15 7.8 16.4 7 18 7h2M17 4l3 3-3 3M17 14l3 3-3 3"/></svg></button>
        <button class="key" id="prev" title="Sebelumnya" aria-label="Sebelumnya"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="key main" id="pp" data-s="play" title="Putar/Jeda (Spasi)" aria-label="Putar"><svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
        <button class="key" id="next" title="Berikutnya" aria-label="Berikutnya"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button class="key" id="rep" title="Ulang (R)" aria-label="Ulang"><svg class="st" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 013-3h16M7 21l-3-3 3-3M20 13v2a3 3 0 01-3 3H1"/></svg></button>
      </div>
      <div class="vol"><span>Vol</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume"></div>
      <button class="key" id="theme" title="Ganti tema" aria-label="Ganti tema"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 010 16z"/></svg></button>
    </div>
  </header>
  <nav class="tabs"><button data-v="list" aria-pressed="true">Daftar</button><button data-v="lyr" aria-pressed="false">Lirik</button></nav>
  <main>
    <section class="list" id="list">
      <div class="bar">
        <input type="search" id="q" placeholder="Cari judul atau artis" aria-label="Cari lagu">
        <button class="tb" id="addf" hidden>Folder</button><button class="tb fill" id="add">Tambah lagu atau .lrc</button>
      </div>
      <div class="head"><span>#</span><span>Judul</span><span>Artis</span><span>Durasi</span><span></span></div>
      <div class="rows" id="rows"></div>
    </section>
    <section class="lyrics">
      <div class="lbar"><span id="ls">Lirik</span><button class="tb" id="li" aria-pressed="false">Info</button><button class="tb" id="lc">Atur</button><button class="tb" id="lf">Cari online</button></div>
      <div class="cfg" id="cfg" hidden>
        <label><input type="checkbox" data-k="lrclib"> LRCLIB, cocokkan durasi</label>
        <label><input type="checkbox" data-k="search"> LRCLIB, pencarian</label>
        <label><input type="checkbox" data-k="ovh"> lyrics.ovh (teks biasa)</label>
        <label><input type="checkbox" data-k="synced"> Utamakan lirik sinkron (LRC)</label>
        <label class="r"><span>Kemiripan judul</span><b data-v="ts"></b><input type="range" data-k="ts" min="50" max="100"></label>
        <label class="r"><span>Kemiripan artis</span><b data-v="as"></b><input type="range" data-k="as" min="50" max="100"></label>
        <small>Hasil yang kemiripannya di bawah batas, atau durasinya beda lebih dari 4 detik, dibuang.</small>
      </div>
      <div class="meta" id="meta" hidden></div>
      <div class="lyr" id="lyr"><div class="ln msg">Belum ada lirik</div></div>
    </section>
  </main>
</div>
<input type="file" id="file" accept="audio/*,.lrc,.txt" multiple hidden>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var au=new Audio();au.preload="metadata";
var T=[],cur=-1,shuf=false,rep=0,ctx,an,data,q="";
function fmt(s){if(!isFinite(s))return"–";s=Math.floor(s);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function parse(n){n=n.replace(/\.[^.]+$/,"").replace(/_/g," ");var m=n.split(/\s+-\s+/);return m.length>1?{a:m[0],t:m.slice(1).join(" - ")}:{a:"Artis tidak diketahui",t:n}}
var LR={},LN=null,li=-1,R={},st,live=false,running=0,dq=0,vs=0,hist=[],bag=[],fc=0,acc="";
function base(n){return n.replace(/\.[^.]+$/,"").toLowerCase()}
function parseLRC(t){
  var out=[],plain=[];
  String(t).split(/\r?\n/).forEach(function(l){
    var m,re=/\[(\d+):(\d+(?:\.\d+)?)\]/g,ts=[],last=0;
    while((m=re.exec(l))){ts.push(+m[1]*60+parseFloat(m[2]));last=re.lastIndex}
    var tx=l.slice(last).trim();
    if(ts.length){ts.forEach(function(x){out.push({t:x,s:tx})})}
    else if(!/^\[[a-z]+:/i.test(l.trim()))plain.push({t:null,s:l.trim()});
  });
  if(out.length){out.sort(function(a,b){return a.t-b.t});return out}
  return plain.length?plain:null;
}
function dec(b,enc){return new TextDecoder(enc===1?"utf-16":enc===2?"utf-16be":enc===3?"utf-8":"windows-1252").decode(b)}
function id3Lyrics(buf){
  var d=new Uint8Array(buf);if(d[0]!==73||d[1]!==68||d[2]!==51)return null;
  var v=d[3],p=10,end=Math.min(d.length,10+(d[6]<<21|d[7]<<14|d[8]<<7|d[9]));
  while(p+10<=end){
    var id=String.fromCharCode(d[p],d[p+1],d[p+2],d[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
    var sz=v===4?(d[p+4]<<21|d[p+5]<<14|d[p+6]<<7|d[p+7]):((d[p+4]<<24|d[p+5]<<16|d[p+6]<<8|d[p+7])>>>0);
    if(id==="USLT"){
      var b=d.subarray(p+10,p+10+sz),e=b[0],k=4,w=(e===1||e===2)?2:1;
      while(k<b.length-w+1&&!(b[k]===0&&(w===1||b[k+1]===0)))k+=w;
      return dec(b.subarray(k+w),e).replace(/^\uFEFF/,"");
    }
    p+=10+sz;
  }
  return null;
}
function add(files){
  [].forEach.call(files,function(f){
    if(/\.(lrc|txt)$/i.test(f.name)){
      f.text().then(function(t){var b=base(f.name);LR[b]=t;T.forEach(function(o){if(o.base===b){o.l=parseLRC(t);o.src="File .lrc";if(T[cur]===o)showL(o)}})});return;
    }
    if(f.type.indexOf("audio")!==0&&!/\.(mp3|flac|wav|ogg|m4a|aac|opus)$/i.test(f.name))return;
    var K=f._p&&f._r+"/"+f._p.join("/");if(K&&T.some(function(o){return o.k===K}))return;
    var p=parse(f.name),b=base(f.name),o={url:URL.createObjectURL(f),t:p.t,a:p.a,d:NaN,base:b,l:LR[b]?parseLRC(LR[b]):null,r:f._r,p:f._p,k:K};T.push(o);
    if(o.l)o.src="File .lrc";
    if(/\.mp3$/i.test(f.name)){
      o.ready=f.slice(0,10).arrayBuffer().then(function(h){var x=new Uint8Array(h);if(x[0]!==73)return;return f.slice(0,10+(x[6]<<21|x[7]<<14|x[8]<<7|x[9])).arrayBuffer()}).then(function(buf){
        if(!buf)return;var t=id3Lyrics(buf);if(t&&!o.l){o.l=parseLRC(t);o.src="Tag file";if(T[cur]===o)showL(o)}}).catch(function(){});
    }else if(/\.flac$/i.test(f.name)){
      o.name=f.name;
      o.ready=flacTags(f).then(function(r){
        if(!r)return;var tg=r.tags;o.tags=tg;o.info=r.info;o.pic=r.pic;o.size=f.size;
        if(tg.TITLE)o.t=tg.TITLE;if(tg.ARTIST)o.a=tg.ARTIST;
        var ly=tg.LYRICS||tg.UNSYNCEDLYRICS||tg.SYNCEDLYRICS;if(ly&&!o.l){o.l=parseLRC(ly);o.src="Tag file"}
        if(r.info&&!isFinite(o.d))o.d=r.info.total/r.info.sr;
        return r.pic?toData(r.pic).then(function(u){o.cover=u}):null;
      }).then(function(){draw();if(T[cur]===o){skin(o);showL(o);showInfo()}}).catch(function(){});
    }
    (o.ready||Promise.resolve()).then(function(){PQ.push(o);pump()});
  });
  draw();if(cur<0&&T.length)play(0);
}
function showL(o){
  save();var el=$("lyr");li=-1;LN=o&&o.l?o.l:null;$("ls").textContent=LN&&o.src?"Lirik · "+o.src:"Lirik";
  if(!LN){el.innerHTML='<div class="ln msg">'+esc(o&&o.msg||"Belum ada lirik")+'</div>';return}
  el.innerHTML=LN.map(function(x,i){return'<div class="ln"'+(x.t!=null?' data-t="'+x.t+'"':'')+'>'+(x.s?x.s.split(" ").map(function(w,j){return'<span class="w" style="--i:'+j+'">'+esc(w)+'</span>'}).join(" "):"&nbsp;")+'</div>'}).join("");
  el.scrollTop=0;
}
function hl(){
  if(!LN||LN[0].t==null)return;
  var c=au.currentTime,n=-1;for(var i=0;i<LN.length;i++){if(LN[i].t<=c)n=i;else break}
  if(n===li)return;var el=$("lyr"),k=el.children;
  if(li>=0&&k[li])k[li].classList.remove("on");
  li=n;if(n>=0&&k[n]){k[n].classList.add("on");el.scrollTo({top:k[n].offsetTop-el.clientHeight/2+k[n].clientHeight/2,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
